<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#52717c"/></marker><marker id="both" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M9 0L0 4L9 8Z" fill="#52717c"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><rect x="0" y="0" width="16" height="760" fill="#173745"/><text x="60" y="63" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173745">DFD Level 2 · Event registration</text><text x="60" y="96" font-family="Arial,sans-serif" font-size="16" fill="#617780">Expanded view of process 4.0: role and event checks precede an atomic seat allocation.</text><line x1="60" y1="120" x2="1340" y2="120" stroke="#dbe4e7" stroke-width="2"/><rect x="65" y="270" width="210" height="74" rx="7" fill="#ffffff" stroke="#173745" stroke-width="2"/><text x="170" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173745"><tspan x="170" dy="0">STUDENT</tspan></text><rect x="350" y="250" width="245" height="105" rx="18" fill="#edf4f5" stroke="#2c6575" stroke-width="2"/><circle cx="378" cy="277" r="17" fill="#173745"/><text x="378" y="282" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">4.1</text><text x="480.5" y="292.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#203640"><tspan x="480.5" dy="0">Verify student role</tspan><tspan x="480.5" dy="22">and event access</tspan></text><rect x="665" y="250" width="265" height="105" rx="18" fill="#edf4f5" stroke="#2c6575" stroke-width="2"/><circle cx="693" cy="277" r="17" fill="#173745"/><text x="693" y="282" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">4.2</text><text x="805.5" y="292.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#203640"><tspan x="805.5" dy="0">Check date, deadline</tspan><tspan x="805.5" dy="22">and seat availability</tspan></text><rect x="1000" y="250" width="245" height="105" rx="18" fill="#edf4f5" stroke="#2c6575" stroke-width="2"/><circle cx="1028" cy="277" r="17" fill="#173745"/><text x="1028" y="282" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">4.3</text><text x="1130.5" y="292.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#203640"><tspan x="1130.5" dy="0">Save registration and</tspan><tspan x="1130.5" dy="22">return confirmation</tspan></text><path d="M530 455 H805 V545 Q667.5 565 530 545 Z" fill="#f7f8f6" stroke="#52717c" stroke-width="2"/><rect x="530" y="455" width="275" height="30" fill="#e6eef0"/><text x="546" y="476" font-family="Arial" font-size="14" font-weight="700" fill="#173745">D2 · DATA STORE</text><text x="667.5" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203640"><tspan x="667.5" dy="0">Events · available seats</tspan></text><path d="M850 455 H1125 V545 Q987.5 565 850 545 Z" fill="#f7f8f6" stroke="#52717c" stroke-width="2"/><rect x="850" y="455" width="275" height="30" fill="#e6eef0"/><text x="866" y="476" font-family="Arial" font-size="14" font-weight="700" fill="#173745">D3 · DATA STORE</text><text x="987.5" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#203640"><tspan x="987.5" dy="0">Registrations</tspan></text><path d="M275 307 H350" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="241.9" y="209" width="140.2" height="23" rx="5" fill="white"/><text x="312" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Event ID + request</text><path d="M595 300 H665" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="559.9" y="209" width="140.2" height="23" rx="5" fill="white"/><text x="630" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Authorized request</text><path d="M930 300 H1000" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="901.8" y="209" width="126.4" height="23" rx="5" fill="white"/><text x="965" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Eligible booking</text><path d="M795 355 V455" fill="none" stroke="#52717c" stroke-width="2" marker-start="url(#both)" marker-end="url(#arrow)"/><rect x="776.65" y="404" width="174.70000000000002" height="23" rx="5" fill="white"/><text x="864" y="420" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Read and decrement seat</text><path d="M1125 355 V455" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1094.1" y="404" width="167.8" height="23" rx="5" fill="white"/><text x="1178" y="420" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Unique student booking</text><path d="M1120 250 V160 H170 V270" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="521.95" y="124" width="216.10000000000002" height="23" rx="5" fill="white"/><text x="630" y="140" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Confirmation or clear failure</text><line x1="60" y1="695" x2="1340" y2="695" stroke="#dbe4e7"/><text x="60" y="727" font-family="Arial,sans-serif" font-size="14" fill="#617780">The availability update and registration insert run in one SQLite transaction. Duplicate requests do not consume another seat. A ticket code is not attendance verification.</text></svg>