<text xml:space="preserve" text-anchor="middle" x="779.03" y="-84.24" font-family="Arial" font-size="12.00">All content tables: id + data(JSON) + created_at + updated_at.</text>
<text xml:space="preserve" text-anchor="middle" x="779.03" y="-69.84" font-family="Arial" font-size="12.00">Fields below id describe the JSON payload, not separate SQL columns.</text>
<text xml:space="preserve" text-anchor="middle" x="779.03" y="-55.44" font-family="Arial" font-size="12.00">College&#45;scoped content may omit a department.</text>
<text xml:space="preserve" text-anchor="middle" x="779.03" y="-41.04" font-family="Arial" font-size="12.00">Bookmark target is polymorphic: NOTICE / EVENT / CAREER / RESOURCE.</text>
<text xml:space="preserve" text-anchor="middle" x="779.03" y="-26.64" font-family="Arial" font-size="12.00">Its itemId is not a physical SQL foreign key.</text>
<text xml:space="preserve" text-anchor="middle" x="779.03" y="-12.24" font-family="Arial" font-size="12.00">A user can have at most one account row; seeded/registered users have one.</text>
</g>
