pan><tspan x="947.5" dy="22">optional</tspan></text><path d="M250 304 H290" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="234.4" y="209" width="71.2" height="23" rx="5" fill="white"/><text x="270" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Question</text><path d="M515 304 H555" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="461.45" y="209" width="147.1" height="23" rx="5" fill="white"/><text x="535" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Authenticated query</text><path d="M785 304 H825" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="728" y="209" width="154" height="23" rx="5" fill="white"/><text x="805" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Top matching records</text><path d="M940 358 V398 H948 V490" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="885.75" y="439" width="188.5" height="23" rx="5" fill="white"/><text x="980" y="455" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Scoped context + question</text><path d="M1050 525 H1070 V345 H1090" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1002.3" y="454" width="195.4" height="23" rx="5" fill="white"/><text x="1100" y="470" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Generated response / error</text><path d="M670 358 V475" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="643.55" y="412" width="160.9" height="23" rx="5" fill="white"/><text x="724" y="428" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Read approved records</text><path d="M1210 358 V610 H150 V343" fill="none" stroke="#52717c" stroke-width="2"  marker-end="url(#arrow)"/><rect x="511.25" y="589" width="257.5" height="23" rx="5" fill="white"/><text x="640" y="605" text-anchor="middle" font-family="Arial" font-size="13" fill="#617780">Cited answer · unknown · Basic mode</text><line x1="60" y1="695" x2="1340" y2="695" stroke="#dbe4e7"/><text x="60" y="727" font-family="Arial,sans-serif" font-size="14" fill="#617780">Only records the signed-in user may access are retrieved. Provider keys and account records stay server-side. Citations are checked, but do not guarantee factual accuracy.</text></svg>