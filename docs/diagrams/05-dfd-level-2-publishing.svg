<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#52717c"/></marker><marker id="both" markerWidth="10" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M9 0L0 4L9 8Z" fill="#52717c"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><rect x="0" y="0" width="16" height="760" fill="#173745"/><text x="60" y="63" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173745">DFD Level 2 · Content publishing and approval</text><text x="60" y="96" font-family="Arial,sans-serif" font-size="16" fill="#617780">Expanded view of process 2.0: faculty notices and events move through review before publication.</text><line x1="60" y1="120" x2="1340" y2="120" stroke="#dbe4e7" stroke-width="2"/><rect x="65" y="265" width="210" height="74" rx="7" fill="#ffffff" stroke="#173745" stroke-width="2"/><text x="170" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173745"><tspan x="170" dy="0">FACULTY AUTHOR</tspan></text><rect x="915" y="155" width="265" height="74" rx="7" fill="#ffffff" stroke="#173745" stroke-width="2"/><text x="1047.5" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173745"><tspan x="1047.5" dy="0">DEPARTMENT ADMIN</tspan><tspan x="1047.5" dy="22">or COLLEGE ADMIN</tspan></text><rect x="345" y="250" width="245" height="105" rx="18" fill="#edf4f5" stroke="#2c6575" stroke-width="2"/><circle cx="373" cy="277" r="17" fill="#173745"/><text x="373" y="282" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">2.1</text><text x="475.5" y="292.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#203640"><tspan x="475.5" dy="0">Validate submission</tspan><tspan x="475.5" dy="22">and author permissions</tspan