<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#357486"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L9 4L0 8Z" fill="#357486"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect width="14" height="100%" fill="#163744"/><text x="58" y="62" font-family="Arial" font-size="32" font-weight="700" fill="#163744">DFD Level 2 · Content approval</text><text x="60" y="98" font-family="Arial" font-size="17" fill="#607780">Faculty submissions are checked, reviewed by an authorized administrator and recorded.</text><line x1="60" y1="126" x2="1540" y2="126" stroke="#dce5e8" stroke-width="2"/><rect x="70" y="390" width="260" height="110" rx="9" fill="white" stroke="#163744" stroke-width="2"/><text x="200" y="435" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#163744"><tspan x="200" dy="0">FACULTY</tspan></text><text x="200" y="461" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#607780"><tspan x="200" dy="0">Creates notice or event</tspan></text><rect x="405" y="390" width="285" height="110" rx="18" fill="#edf4f5" stroke="#357486" stroke-width="2"/><circle cx="435" cy="419" r="18" fill="#163744"/><text x="435" y="424" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">2.1</text><text x="557.5" y="437" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#263b43"><tspan x="557.5" dy="0">Validate submission</tspan></text><text x="557.5" y="462" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#607780"><tspan x="557.5" dy="0">Owner · role · fields</tspan></text><rect x="770" y="390" width="285" height="110" rx="18" fill="#edf4f5" stroke="#357486" stroke-width="2"/><circle cx="800" cy="419" r="18" fill="#163744"/><text x="800" y="424" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">2.2</text><text x="922.5" y="437" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#263b43"><tspan x="922.5" dy="0">Review pending item</tspan></text><text x="922.5" y="462" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#607780"><tspan x="922.5" dy="0">Authorized admin review</tspan></text><rect x="1130" y="390" width="285" height="110" rx="18" fill="#edf4f5" stroke="#357486" stroke-width="2"/><circle cx="1160" cy="419" r="18" fill="#163744"/><text x="1160" y="424" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">2.3</text><text x="1282.5" y="437" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#263b43"><tspan x="1282.5" dy="0">Record decision</tspan></text><text x="1282.5" y="462" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#607780"><tspan x="1282.5" dy="0">Status · reason · alert</tspan></text><path d="M770 618 Q912.5 607 1055 618 V711 Q912.5 723 770 711 Z" fill="#f5f7f6" stroke="#718993" stroke-width="2"/><rect x="771" y="618" width="283" height="34" fill="#e7eef0"/><text x="785" y="641" font-family="Arial" font-size="14" font-weight="700" fill="#163744">D2  CONTENT · DATA STORE</text><text x="912.5" y="676" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#263b43"><tspan x="912.5" dy="0">Notices · events</tspan></text><path d="M1130 618 Q1272.5 607 1415 618 V711 Q1272.5 723 1130 711 Z" fill="#f5f7f6" stroke="#718993" stroke-width="2"/><rect x="1131" y="618" width="283" height="34" fill="#e7eef0"/><text x="1145" y="641" font-family="Arial" font-size="14" font-weight="700" fill="#163744">D3  NOTIFICATIONS · DATA STORE</text><text x="1272.5" y="676" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#263b43"><tspan x="1272.5" dy="0">Author outcome</tspan></text><rect x="790" y="170" width="245" height="76" rx="9" fill="white" stroke="#163744" stroke-width="2"/><text x="912.5" y="198" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#163744"><tspan x="912.5" dy="0">ADMIN REVIEWER</tspan></text><text x="912.5" y="224" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#607780"><tspan x="912.5" dy="0">Department / College</tspan></text><path d="M912 246 V390" fill="none" stroke="#357486" stroke-width="2"  marker-end="url(#a)" /><rect x="934.75" y="298" width="130.5" height="24" rx="5" fill="white"/><text x="1000" y="315" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Review decision</text><path d="M330 445 H405" fill="none" stroke="#357486" stroke-width="2"  marker-end="url(#a)" /><rect x="331.75" y="348" width="70.5" height="24" rx="5" fill="white"/><text x="367" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Content</text><path d="M690 445 H770" fill="none" stroke="#357486" stroke-width="2"  marker-end="url(#a)" /><rect x="661" y="348" width="138" height="24" rx="5" fill="white"/><text x="730" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Valid submission</text><path d="M1055 445 H1130" fill="none" stroke="#357486" stroke-width="2"  marker-end="url(#a)" /><rect x="1053" y="348" width="78" height="24" rx="5" fill="white"/><text x="1092" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Decision</text><path d="M912 500 V610" fill="none" stroke="#357486" stroke-width="2"   marker-start="url(#as)" marker-end="url(#a)"/><rect x="942.25" y="543" width="235.5" height="24" rx="5" fill="white"/><text x="1060" y="560" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Pending item / saved decision</text><path d="M1272 500 V610" fill="none" stroke="#357486" stroke-width="2"  marker-end="url(#a)" /><rect x="1282.25" y="543" width="115.5" height="24" rx="5" fill="white"/><text x="1340" y="560" text-anchor="middle" font-family="Arial" font-size="14" fill="#607780">Notify author</text><line x1="60" y1="924" x2="1540" y2="924" stroke="#dce5e8"/><text x="60" y="950" font-family="Arial" font-size="14" fill="#607780">Only pending content can be reviewed. Department admins act within their department. Rejected items can be corrected and resubmitted.</text></svg>