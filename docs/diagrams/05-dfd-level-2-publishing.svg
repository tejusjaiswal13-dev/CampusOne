ddle" font-family="Arial" font-size="13" fill="#617780">Submission / decision result</text><line x1="60" y1="695" x2="1340" y2="695" stroke="#dbe4e7"/><text x="60" y="727" font-family="Arial,sans-serif" font-size="14" fill="#617780">Only pending content can be reviewed. Department administrators are limited to their own department; rejected content may be corrected and resubmitted.</text></svg>